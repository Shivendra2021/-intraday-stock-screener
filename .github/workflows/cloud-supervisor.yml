name: Cloud Supervisor

on:
  workflow_dispatch:
  # Automated schedule disabled by user request:
  # schedule:
  #   - cron: "25 3 * * 1-5"
  #   - cron: "40 3 * * 1-5"
  #   - cron: "55 3 * * 1-5"
  #   - cron: "0,30 4-9 * * 1-5"
  #   - cron: "5 10 * * 1-5"
  #   - cron: "20 10 * * 1-5"
  #   - cron: "35 10 * * 1-5"
  #   - cron: "0 11 * * 1-5"
  #   - cron: "30 13 * * 1-5"

concurrency:
  group: cloud-supervisor
  cancel-in-progress: false

jobs:
  cloud-supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    env:
      TZ: Asia/Kolkata
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
      OPENROUTER_GROK_KEY: ${{ secrets.OPENROUTER_GROK_KEY || secrets.GROK_KEY }}
      OPENROUTER_GPT_KEY: ${{ secrets.OPENROUTER_GPT_KEY || secrets.GPT_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_DEEPSEEK_MODEL: groq/compound-mini
      GROQ_DEEPSEEK_ENABLED: "True"
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1/chat/completions
      GROK_MODEL: x-ai/grok-3-mini
      GPT_MODEL: openai/gpt-oss-120b:free
      THENEWSAPI_KEY: ${{ secrets.THENEWSAPI_KEY }}
      NEWSAPI_KEY: ""
      ZERODHA_API_KEY: ""
      ZERODHA_ACCESS_TOKEN: ""
      BSE_UNIVERSE_ENABLED: "False"
      GROK_DASHBOARD_AGENT_ENABLED: "False"
      INTRADAY_PATTERN_AGENT_ENABLED: "False"
      OLLAMA_AGENT_ENABLED: "False"
      AUTOMATION_SUPERVISOR_ENABLED: "True"
      POSTMARKET_DEEP_LEARNING_ENABLED: "True"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cloud data cache
        id: restore-data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stock-analyser-data-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-analyser-data-${{ github.ref_name }}-
            stock-analyser-data-

      - name: Ensure runtime folders
        run: |
          mkdir -p data logs output

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Check repository secrets."
              missing=1
            else
              echo "$name is configured"
            fi
          done

          # Check AI brain providers (at least one AI brain: Groq or OpenRouter)
          if [ -n "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is configured (Groq Cloud AI active)"
          elif [ -n "$OPENROUTER_GROK_KEY" ] || [ -n "$OPENROUTER_GPT_KEY" ]; then
            echo "OpenRouter AI key is configured"
          else
            echo "::warning::No AI brain key found (GROQ_API_KEY or OPENROUTER_GROK_KEY). System will screen and pick algorithmically."
          fi

          exit "$missing"

      - name: Run cloud supervisor
        run: python tools/run_cloud_supervisor.py

      - name: Save cloud data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stock-analyser-data-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload runtime data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-runtime-data-${{ github.run_id }}
          path: |
            data
            logs
          retention-days: 7
